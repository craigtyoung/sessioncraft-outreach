<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach Hub — Board</title>
  <link rel="icon" href="/sc-voice-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Shared sidebar (matches Overview) -->
    <aside class="side">
      <div class="brand">
        <img src="/sc-voice-icon.png" alt="SessionCraft" />
        <div class="brand-text"><h1>Outreach Hub</h1><span>one audience · all products</span></div>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="/"><span class="ic">◆</span> Overview</a>
        <div class="grp">Board</div>
        <button class="tab-btn active" data-tab="practitioners"><span class="ic">♦</span> Practitioners</button>
        <button class="tab-btn" data-tab="organizations"><span class="ic">▤</span> Organizations</button>
        <button class="tab-btn tab-btn-ideas" data-tab="ideas"><span class="ic">✦</span> Ideas</button>
      </nav>
      <div class="side-foot">
        <div class="side-controls">
          <div class="user-selector">
            <span class="user-label">You:</span>
            <select id="userSelect" class="user-select">
              <option value="Craig">Craig</option>
              <option value="Scottie">Scottie</option>
              <option value="Christine">Christine</option>
            </select>
          </div>
          <button class="theme-toggle" id="themeToggle" title="Toggle light/dark">☀</button>
        </div>
        <button class="btn-primary" id="btnAdd">+ Add contact</button>
      </div>
    </aside>

    <!-- Main column -->
    <div class="main-col">
      <div class="goals-bar" id="goalsBar"></div>

      <div class="toolbar">
        <div class="toolbar-inner">
          <input type="text" id="searchInput" placeholder="Search..." class="search-input" />
          <div class="filters" id="filterBar"></div>
          <div class="stats" id="statsBar"></div>
        </div>
      </div>

      <main id="mainContent"></main>
    </div>

    <!-- Detail Panel -->
    <div class="overlay" id="overlay"></div>
    <aside class="detail-panel" id="detailPanel">
      <div class="panel-header">
        <div>
          <h2 id="panelName"></h2>
          <div id="panelMeta" class="panel-meta"></div>
        </div>
        <button class="close-btn" id="closePanel">✕</button>
      </div>
      <div class="panel-body">
        <div class="panel-fields" id="panelFields"></div>
        <div class="panel-log">
          <h3>Communication Log</h3>
          <div class="log-add">
            <textarea id="logNote" placeholder="Add a note..." rows="3"></textarea>
            <div class="log-add-footer">
              <label class="log-date-label">Date: <input type="date" id="logDate" /></label>
              <button class="btn-primary btn-sm" id="btnAddLog">Add Note</button>
            </div>
          </div>
          <div id="logEntries" class="log-entries"></div>
        </div>
      </div>
    </aside>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 id="modalTitle">Add Contact</h2>
          <button class="close-btn" id="closeModal">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button class="btn-secondary" id="btnModalCancel">Cancel</button>
          <button class="btn-primary" id="btnModalSave">Save</button>
        </div>
      </div>
    </div>

    <div id="idea-tooltip" class="idea-tooltip"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
